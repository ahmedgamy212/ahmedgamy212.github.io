<svg id="portfolioCardSvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" class="w-full h-auto block" style="font-family: 'Inter', system-ui, -apple-system, sans-serif;">
                <defs>
                    <!-- Background Main Gradient -->
                    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#0f192d"/>
                        <stop offset="50%" stop-color="#0b1323"/>
                        <stop offset="100%" stop-color="#070c18"/>
                    </linearGradient>

                    <!-- Top Right Soft Overlay Circle Gradient -->
                    <radialGradient id="topRightGlow" cx="80%" cy="20%" r="55%">
                        <stop offset="0%" stop-color="#1e325c" stop-opacity="0.45"/>
                        <stop offset="50%" stop-color="#142343" stop-opacity="0.2"/>
                        <stop offset="100%" stop-color="#0b1323" stop-opacity="0"/>
                    </radialGradient>

                    <!-- Accent Line Gradient for Graphic -->
                    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#3b82f6"/>
                        <stop offset="100%" stop-color="#60a5fa"/>
                    </linearGradient>
                </defs>

                <!-- Base Canvas Background -->
                <rect width="1200" height="675" fill="url(#bgGradient)"/>

                <!-- Decorative Soft Geometric Circle Top Right -->
                <circle cx="1020" cy="180" r="380" fill="url(#topRightGlow)"/>
                <circle cx="1020" cy="180" r="380" fill="#18294a" fill-opacity="0.15"/>

                <!-- Main Content Area -->
                <g transform="translate(90, 0)">
                    
                    <!-- Title Section -->
                    <text x="0" y="210" fill="#ffffff" font-size="44" font-weight="700" letter-spacing="-0.02em">
                        King Country Housing Analytics &amp;
                    </text>
                    
                    <text x="0" y="272" fill="#ffffff" font-size="44" font-weight="700" letter-spacing="-0.02em">
                        Investment Dashboard
                    </text>

                    <!-- Subtitle / Tech Stack -->
                    <text x="0" y="360" fill="#94a3b8" font-size="25" font-weight="500" letter-spacing="0.01em">
                        Python <tspan fill="#64748b">·</tspan> CatBoost <tspan fill="#64748b">·</tspan> Power BI
                    </text>

                    <!-- Footer / Author Section -->
                    <text x="0" y="585" fill="#64748b" font-size="16" font-weight="600" letter-spacing="0.28em">
                        AHMED GAMAL <tspan fill="#475569">·</tspan> DATA ANALYST PORTFOLIO
                    </text>
                </g>

                <!-- Graphic Element Right (Minimal Line Chart Visualizer) -->
                <g transform="translate(680, 270)">
                    <!-- Baseline -->
                    <line x1="0" y1="230" x2="420" y2="230" stroke="#2563eb" stroke-width="2.5" stroke-opacity="0.6" stroke-linecap="round"/>

                    <!-- Vector Trend Line -->
                    <polyline points="0,210 82,100 160,140 250,10 360,50" fill="none" stroke="url(#lineGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

                    <!-- Optional subtle chart accent nodes -->
                    <circle cx="82" cy="100" r="4" fill="#3b82f6" opacity="0.8"/>
                    <circle cx="160" cy="140" r="4" fill="#3b82f6" opacity="0.8"/>
                    <circle cx="250" cy="10" r="4" fill="#60a5fa" opacity="0.9"/>
                </g>
            </svg>