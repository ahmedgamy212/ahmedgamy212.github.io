      <stop offset="0%" stop-color="#0A1628" />
      <stop offset="100%" stop-color="#112645" />
    </linearGradient>
  </defs>
  <rect width="800" height="420" rx="16" fill="url(#bg5)" />
  <circle cx="680" cy="60" r="140" fill="#1E3A8A" opacity="0.22" />
  <circle cx="560" cy="390" r="160" fill="#1D4ED8" opacity="0.15" />

  <!-- Text Content -->
  <text x="52" y="135" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="33" font-weight="700" letter-spacing="-0.5">Sberbank Russian Housing Market</text>
  <text x="52" y="175" fill="#93C5FD" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="400">Python • XGBoost • Power BI</text>
