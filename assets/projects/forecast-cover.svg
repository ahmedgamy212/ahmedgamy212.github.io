<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1628" />
      <stop offset="100%" stop-color="#112645" />
    </linearGradient>
  </defs>
  <rect width="800" height="420" rx="16" fill="url(#bg3)" />
  <circle cx="680" cy="60" r="140" fill="#1E3A8A" opacity="0.22" />
  <circle cx="560" cy="390" r="160" fill="#1D4ED8" opacity="0.15" />

  <!-- Text Content -->
  <text x="52" y="135" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="33" font-weight="700" letter-spacing="-0.5">Store Sales Time Series Forecasting</text>
  <text x="52" y="175" fill="#93C5FD" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="400">Forecasting • Python • Machine Learning</text>
  <text x="52" y="365" fill="#64748B" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="2.5">AHMED GAMAL • DATA ANALYST PORTFOLIO</text>

  <!-- Custom Time Series + Forecast Vector -->
  <g transform="translate(520, 145)">
    <line x1="-10" y1="145" x2="220" y2="145" stroke="#1E3A8A" stroke-width="2" />
    <!-- Vertical Divider between Historical and Forecast -->
    <line x1="115" y1="15" x2="115" y2="145" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />
    <!-- Confidence Interval Cone -->
    <polygon points="115,75 205,20 205,70" fill="#3B82F6" opacity="0.2" />
    <!-- Historical Solid Line -->
    <polyline points="10,120 45,95 80,108 115,75" fill="none" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Forecast Dashed Line -->
    <polyline points="115,75 160,55 205,45" fill="none" stroke="#93C5FD" stroke-width="3" stroke-dasharray="6 6" stroke-linecap="round" />
    <circle cx="115" cy="75" r="5" fill="#FFFFFF" />
    <circle cx="205" cy="45" r="5" fill="#60A5FA" />
  </g>
</svg>